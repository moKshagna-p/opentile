name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 30
    runs-on: macos-15
    env:
      # Both OpenTile and the embedded AeroSpace package require Swift 6.2.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          bash -n build.sh
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Verify Apple Silicon runner and toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Test OpenTile with Swift Testing
        run: scripts/test.sh
      - name: Test focus benchmark tooling
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          swiftc scripts/focused-window.swift -o "$RUNNER_TEMP/focused-window"
          "$RUNNER_TEMP/focused-window" --self-test
      - name: Package application
        env:
          OPENTILE_SIGNING_IDENTITY: "-"
        run: scripts/package.sh
      - name: Upload downloadable application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenTile-macOS-arm64
          path: |
            .build/package/OpenTile-macOS-arm64.zip
            .build/package/SHA256.txt
          if-no-files-found: error
          retention-days: 30
